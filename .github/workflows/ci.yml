name: CI

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy

      # The trainer and the engine compute the same network twice, in Python
      # and in AVX2. A disagreement between them makes every measurement taken
      # during training meaningless, and nothing else would notice it, so it is
      # checked on every push rather than when someone remembers to.
      - name: Generate positions
        run: ./build/Release/luna-datagen.exe --out ci.bin --sfen-out ci.sfen --games 6 --depth 3 --maxply 100 --concurrency 2

      - name: Python and C++ agree on the evaluation
        run: python -m training.verify --engine build/Release/luna-shougi.exe --random-net ci.nnue --sfen ci.sfen

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: pip install numpy

      - name: Generate positions
        run: ./build/luna-datagen --out ci.bin --sfen-out ci.sfen --games 6 --depth 3 --maxply 100 --concurrency 2

      # The same check as on Windows, but against the NEON kernels. This is the
      # only automated test the NEON path gets: it cannot run on the machine
      # the engine is developed on.
      - name: Python and C++ agree on the evaluation
        run: python -m training.verify --engine build/luna-shougi --random-net ci.nnue --sfen ci.sfen
